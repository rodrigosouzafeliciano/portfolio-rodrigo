<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" role="img" aria-label="Interactive Developer Portfolio Banner">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="crtGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 38px; fill: #f8fafc; letter-spacing: -0.5px; }
    .sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; font-size: 16px; fill: url(#neonGrad); }
    .meta { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
    .chip { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
    .scanline { animation: scan 5s linear infinite; }
    .pulse { animation: pulseGlow 2.4s ease-in-out infinite; }
    .floatCard { animation: floatY 4.5s ease-in-out infinite; }
    .cursorBlink { animation: blink 1s steps(1, end) infinite; }
    @keyframes scan {
      0% { transform: translateY(-10px); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.35; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <rect width="1200" height="300" rx="16" fill="url(#bgPort)"/>
  <rect width="1200" height="300" rx="16" fill="url(#crtGrid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#neonGrad)" class="scanline"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="14.5" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" stroke-opacity="0.45"/>

  <g transform="translate(64, 56)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" class="pulse"/>
    <text x="30" y="18" class="chip" fill="#e2e8f0">LIVE ON VERCEL · RETRO-TERMINAL UI</text>

    <text x="0" y="76" class="title">Interactive Developer Portfolio</text>
    <text x="0" y="108" class="sub">&gt; React 19 · Vite 6 · Cyberpunk CRT Design System · Responsive UI</text>
    <text x="0" y="140" class="meta">Single-source-of-truth data model · Filterable Tech Arsenal · Direct ATS Resume Download</text>

    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="124" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="62" y="18" text-anchor="middle" class="chip" fill="#38bdf8">React 19.1</text>

      <rect x="136" y="0" width="110" height="28" rx="6" fill="#0f172a" stroke="#e879f9" stroke-width="1"/>
      <text x="191" y="18" text-anchor="middle" class="chip" fill="#e879f9">Vite 6.3</text>

      <rect x="258" y="0" width="136" height="28" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="326" y="18" text-anchor="middle" class="chip" fill="#22c55e">Zero-Deps CSS</text>

      <rect x="406" y="0" width="144" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="478" y="18" text-anchor="middle" class="chip" fill="#38bdf8">Vercel Deploy</text>
    </g>
  </g>

  <!-- Right Terminal Preview Graphic (Nested <g> prevents CSS transform from overriding SVG translate!) -->
  <g transform="translate(830, 44)">
    <g class="floatCard">
      <rect x="0" y="0" width="310" height="212" rx="10" fill="#090d16" stroke="#e879f9" stroke-width="1.2" stroke-opacity="0.65"/>
      <rect x="0" y="0" width="310" height="28" rx="10" fill="#131c31"/>
      <circle cx="16" cy="14" r="4.5" fill="#ef4444"/>
      <circle cx="30" cy="14" r="4.5" fill="#f59e0b"/>
      <circle cx="44" cy="14" r="4.5" fill="#22c55e"/>
      <text x="165" y="18" text-anchor="middle" class="chip" fill="#94a3b8">ROOT_SHELL &gt; PORTFOLIO.EXE</text>

      <text x="20" y="56" class="chip" fill="#38bdf8">&gt; INITIALIZING PROFILE...</text>
      <text x="20" y="82" class="chip" fill="#f8fafc">NAME: RODRIGO S. FELICIANO</text>
      <text x="20" y="106" class="chip" fill="#e879f9">ROLE: FULL STACK &amp; QA</text>
      <text x="20" y="130" class="chip" fill="#22c55e">STACK: REACT · NEXT · NODE · TS</text>
      <text x="20" y="154" class="chip" fill="#94a3b8">QA_STANDARD: ZERO_DEFECTS</text>
      <rect x="242" y="142" width="7" height="14" fill="#38bdf8" class="cursorBlink"/>

      <rect x="20" y="172" width="270" height="24" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="155" y="188" text-anchor="middle" class="chip" fill="#22c55e">STATUS: ONLINE // REMOTE</text>
    </g>
  </g>
</svg>
